<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brand Channel Wizard</title>
<meta name="description" content="Set up a YouTube Brand Channel for your course in 5 phases. Answer a few questions and get ready texts, a research prompt, image prompts and a click by click checklist.">
<style>
  :root{
    --ground:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F6F5; --ink:#121A16;
    --muted:#55635C; --line:#DCE3DF; --green:#17C05B; --green-deep:#10A34B;
    --green-soft:#17C05B16; --on-green:#FFFFFF; --red:#E0243B;
    --shadow:0 1px 2px #121a1610, 0 6px 18px -10px #121a1626;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0A120E; --surface:#121C17; --surface-2:#18241E; --ink:#EAF2EE;
      --muted:#93A69C; --line:#22332B; --green:#19C862; --green-deep:#13A853;
      --green-soft:#19C86222; --on-green:#04140A; --red:#FF5A6E;
      --shadow:0 1px 2px #0007, 0 10px 26px -14px #000a;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0A120E; --surface:#121C17; --surface-2:#18241E; --ink:#EAF2EE;
    --muted:#93A69C; --line:#22332B; --green:#19C862; --green-deep:#13A853;
    --green-soft:#19C86222; --on-green:#04140A; --red:#FF5A6E;
    --shadow:0 1px 2px #0007, 0 10px 26px -14px #000a;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.45;
    padding-inline:16px;padding-block:10px 36px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:11px}
  header{text-align:center}
  h1{margin:0;font-weight:800;letter-spacing:-.025em;line-height:1.15;font-size:clamp(20px,5.2vw,32px)}
  .sub{margin:2px 0 0;font-size:clamp(12.5px,3.1vw,15px);font-weight:700;color:var(--muted)}

  /* progress */
  .prog{display:flex;flex-direction:column;gap:6px}
  .progtop{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
  .bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .25s ease}

  /* green band: the question */
  .band{background:var(--green);color:var(--on-green);border-radius:14px;padding:16px 16px 17px}
  .steptag{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:.94}
  .steptag .n{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:var(--on-green);color:var(--green);font-size:10.5px;line-height:1;font-weight:800}
  .band h2{margin:8px 0 0;font-size:clamp(20px,5vw,27px);font-weight:800;letter-spacing:-.02em;line-height:1.18;text-wrap:balance}
  .why{margin:8px 0 0;font-size:clamp(13.5px,3.4vw,15.5px);font-weight:700;line-height:1.4;opacity:.96}

  /* white card: the answer */
  .card{border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);padding:15px;display:flex;flex-direction:column;gap:11px}
  .card.hl{border:2px solid var(--green)}
  .card h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.015em;line-height:1.25}
  .card p{margin:0}
  .flabel{font-size:13.5px;font-weight:800;margin:0}
  .hint{margin:0;font-size:13.5px;font-weight:600;color:var(--muted);line-height:1.42}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  @media (max-width:620px){.two{grid-template-columns:1fr}}
  input[type=text],input[type=email],input[type=url],textarea{
    width:100%;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:11px;
    padding:12px 13px;font-family:inherit;font-size:16px;font-weight:700;
  }
  textarea{min-height:104px;resize:vertical;line-height:1.4}
  textarea.tall{min-height:240px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:500}
  input:focus,textarea:focus{outline:none;border-color:var(--green)}
  input[type=color]{width:54px;height:46px;border:2px solid var(--line);border-radius:11px;background:var(--surface-2);padding:3px;cursor:pointer}

  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    appearance:none;cursor:pointer;text-align:left;width:100%;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);
    border-radius:12px;padding:13px 14px;font-family:inherit;font-size:16px;font-weight:800;line-height:1.3;
    display:flex;flex-direction:column;gap:2px;min-height:52px;justify-content:center;
  }
  .opt small{font-size:13px;font-weight:600;color:var(--muted)}
  .opt:hover{border-color:var(--green)}
  .opt:focus-visible{outline:3px solid var(--green);outline-offset:2px}
  .opt[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}

  .btn{appearance:none;border:0;background:var(--green);color:var(--on-green);cursor:pointer;font-family:inherit;font-size:16px;font-weight:800;padding:13px 19px;border-radius:11px;min-height:48px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn:hover{background:var(--green-deep)}
  .btn:focus-visible{outline:3px solid var(--green);outline-offset:2px}
  .btn.ghost{background:var(--surface-2);color:var(--ink);border:2px solid var(--line)}
  .btn.ghost:hover{border-color:var(--green);background:var(--surface-2)}
  .btn.small{font-size:13.5px;padding:8px 13px;min-height:36px;border-radius:9px}
  .btn[disabled]{opacity:.5;cursor:default}
  .nav{display:flex;gap:9px;justify-content:space-between;align-items:center;flex-wrap:wrap}
  .nav .grow{flex:1}
  .formerr{color:var(--red);font-size:13.5px;font-weight:700;margin:0}

  .steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;counter-reset:s}
  .steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:15px;font-weight:600;line-height:1.42}
  .steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;font-size:13px;font-weight:800}
  a{color:var(--green-deep);font-weight:800}
  code,.path{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-weight:600;overflow-wrap:anywhere}

  /* tabs after the gate */
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .tab{appearance:none;cursor:pointer;border:2px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:11px;padding:9px 6px;font-family:inherit;font-size:13px;font-weight:800;line-height:1.2;min-height:44px}
  .tab[aria-current="true"]{border-color:var(--green);background:var(--green);color:var(--on-green)}
  .tab:focus-visible{outline:3px solid var(--green);outline-offset:2px}

  .sechead{margin:8px 0 0;font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--green-deep)}
  .blockhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .out{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-family:inherit;font-size:14.5px;font-weight:600;line-height:1.5;max-height:340px;overflow:auto}
  .out.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:500}

  .phase{display:flex;flex-direction:column;gap:8px}
  .phase + .phase{border-top:1px solid var(--line);padding-top:12px}
  .phase h4{margin:0;font-size:15px;font-weight:800}
  .chk{display:grid;grid-template-columns:24px 1fr;gap:9px;align-items:start;font-size:14.5px;font-weight:600;line-height:1.42;cursor:pointer}
  .chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--green)}
  .chk .p{display:block;margin-top:3px;font-size:13px;color:var(--muted);font-weight:600}

  /* uploads */
  .drop{border:2px dashed var(--line);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:9px;background:var(--surface-2)}
  .logos{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .logos figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--muted)}
  .logos img{border-radius:50%;object-fit:cover;background:#fff;border:1px solid var(--line)}
  .banner{position:relative;width:100%;aspect-ratio:2560/1440;border-radius:8px;overflow:hidden;background:#0002}
  .banner img{width:100%;height:100%;object-fit:cover;display:block}
  .banner .desk{position:absolute;left:0;right:0;top:35.3125%;height:29.375%;border-block:2px dashed #ffffffd9;box-shadow:0 0 0 1px #0006}
  .banner .safe{position:absolute;left:19.8047%;width:60.3906%;top:35.3125%;height:29.375%;border:3px solid #17C05B;box-shadow:0 0 0 2000px #00000073}
  .banner .safe span{position:absolute;left:0;top:-22px;background:#17C05B;color:#fff;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:4px;white-space:nowrap}
  .found{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;font-weight:800;border-radius:99px;padding:4px 10px;border:1px solid var(--line);color:var(--muted);background:var(--surface-2)}
  .chip.ok{background:var(--green-soft);border-color:var(--green);color:var(--green-deep)}

  /* status line: what is happening right now, and whether to wait */
  .status{border:2px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;font-weight:700;line-height:1.4}
  .status.busy{border-color:var(--green)}
  .status.busy::before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;border:2px solid var(--green);border-top-color:transparent;border-radius:50%;vertical-align:-1px;animation:spin .8s linear infinite}
  .status.ok{border-color:var(--green);background:var(--green-soft)}
  .status.err{border-color:var(--red);color:var(--red)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){.status.busy::before{animation:none}}
  .linkbtn{appearance:none;border:0;background:none;padding:0;font:inherit;font-weight:800;color:var(--green-deep);text-decoration:underline;cursor:pointer}

  .cta{font-size:15.5px;font-weight:700;line-height:1.4;margin:0}
  footer{color:var(--muted);font-size:12.5px;font-weight:600;line-height:1.55;text-align:center}

  /* rendered research: used on screen (themed) and in the PDF host (fixed light colours) */
  .md h4{margin:0 0 6px;font-size:15px;font-weight:800}
  .md p{margin:0 0 6px;font-size:13.5px;line-height:1.45}
  .md ul{margin:0 0 6px;padding-left:19px;font-size:13.5px}
  .md .tw{overflow-x:auto}
  .md table{border-collapse:collapse;width:100%;font-size:12px;line-height:1.35;margin:0 0 6px}
  .md th,.md td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
  .md th{background:var(--surface-2);font-weight:800}

  .pdfhost{position:fixed;left:-12000px;top:0;width:760px;background:#fff;color:#121A16;font-family:Helvetica,Arial,sans-serif;font-size:13px;line-height:1.45}
  .pdfhost .b{padding:0 0 12px;background:#fff}
  .pdfhost .hero{background:#17C05B;color:#fff;border-radius:12px;padding:22px 24px}
  .pdfhost .hero .k{font-size:11px;font-weight:700;letter-spacing:1.5px}
  .pdfhost .hero .t{font-size:27px;font-weight:700;line-height:1.15;margin:6px 0}
  .pdfhost .hero .m{font-size:13px}
  .pdfhost .sh{font-size:17px;font-weight:700;border-bottom:2px solid #17C05B;padding:8px 0 5px;color:#121A16}
  .pdfhost .lab{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#10A34B;margin-bottom:3px}
  .pdfhost .tx{white-space:pre-wrap;overflow-wrap:anywhere;background:#F4F6F5;border-radius:8px;padding:9px 11px;font-size:12.5px}
  .pdfhost .md th,.pdfhost .md td{border-color:#DCE3DF}
  .pdfhost .md th{background:#E8F9EF}
  .pdfhost .md .tw{overflow:visible}
  .pdfhost .ci{display:grid;grid-template-columns:16px 1fr;gap:8px;font-size:12px;margin-bottom:5px}
  .pdfhost .ci i{width:12px;height:12px;border:1.5px solid #55635C;border-radius:3px;margin-top:2px;display:block}
  .pdfhost .ci i.d{background:#17C05B;border-color:#17C05B}
  .pdfhost .ci span{color:#55635C;display:block;font-size:11px}
  .pdfhost .imgs{display:flex;gap:16px;align-items:center}
  .pdfhost .imgs img.l{width:120px;height:120px;border-radius:50%;object-fit:cover}
  .pdfhost .imgs img.bn{width:100%;border-radius:8px;display:block}
  .pdfhost .ctab{background:#17C05B;color:#fff;border-radius:12px;padding:18px 20px;font-size:15px;font-weight:700}
  .pdfhost .ctab div{font-size:12.5px;font-weight:400;margin-top:5px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Brand Channel Wizard</h1>
    <p class="sub">Your YouTube channel for your course, set up right in 5 phases</p>
  </header>
  <div class="prog" id="prog">
    <div class="progtop"><span id="progL"></span><span id="progR"></span></div>
    <div class="bar"><i id="progBar" style="width:0%"></i></div>
  </div>
  <div id="status" class="status" role="status" aria-live="polite" hidden></div>
  <noscript><div class="card hl"><h3>This wizard needs JavaScript</h3><p class="hint">Switch JavaScript on in your browser settings and reload the page.</p></div></noscript>
  <main id="stage" class="wrap" style="gap:11px"></main>
  <footer>
    Everything runs in your browser. Your images never leave your device.<br>
    Something not working? <button type="button" class="linkbtn" id="diagBtn">Copy a diagnostic report</button> and send it to the person who gave you this link. It contains no answers and no email. <button type="button" class="linkbtn" id="logBtn">Download the full log</button> <span id="ver"></span>
  </footer>
  <div class="card" id="logview" hidden><h3>Live log</h3><pre class="out mono" id="logpre"></pre></div>
</div>
<div class="pdfhost" id="pdfhost" aria-hidden="true"></div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/html2canvas.min.js"></script>
<script>
/* ===== SETTINGS: the two things to edit ===== */
var WEBHOOK_URL = "";   // GHL inbound webhook. Empty = no POST, the kit is still delivered.
var PROGRAM_URL = "https://example.com/6-pillar-cohort";   // placeholder: the 6-pillar cohort program page
var LOG_URL = "";       // optional: every error also posts the diagnostic report here. Empty = the log stays in the visitor's browser.
/* ============================================ */

(function(){
  var $ = function(id){ return document.getElementById(id); };
  var SOURCE = "brand-channel-wizard";
  var VIDIQ_SIGNUP = "https://vidiq.com/";
  var VIDIQ_MCP_GUIDE = "https://vidiq.com/mcp/";
  var VIDIQ_MCP_URL = "https://mcp.vidiq.com/mcp";
  var CTA_LINE = "Next step: build this channel with a group in my 6-pillar cohort program.";
  var CARD_TITLE = "YouTube Evergreen Organic Traffic Card";
  var FILE_BASE = "youtube-evergreen-organic-traffic-card";

  var PHASES = [
    "Account and profile",
    "Brand Channel, handle, verification",
    "Identity and keyword research",
    "Channel customization",
    "Studio defaults and community moderation"
  ];

  /* One question per screen. Each one says why it asks. */
  var QUESTIONS = [
    { id:"who", phase:1, type:"text", key:"who",
      title:"Who do you help?",
      why:"I ask because a channel for everyone gets found by no one. One clear group makes every later step easier.",
      label:"Finish the sentence: I help ...", ph:"busy yoga teachers" },
    { id:"result", phase:1, type:"text", key:"result",
      title:"What do you help them do?",
      why:"I ask because people search for a result, not for a course. This becomes your tagline.",
      label:"Finish the sentence: I help them ...", ph:"fill their classes without paid ads" },
    { id:"topic", phase:1, type:"text", key:"topic",
      title:"What is your course about, in two or three words?",
      why:"I ask because YouTube needs a plain topic to file your channel under.",
      label:"Your topic", ph:"yoga studio marketing" },
    { id:"face", phase:1, type:"face",
      title:"Is the channel you, or a brand?",
      why:"I ask because it decides the name, the handle and the profile picture.",
      opts:[["person","It is me","My own name and my face"],["brand","It is a brand","A business or course name"]] },
    { id:"team", phase:2, type:"choice", key:"team",
      title:"Will anyone else ever touch this channel?",
      why:"I ask because a Brand Channel lets you add a helper, or hand the channel over later, without sharing your Google password.",
      opts:[["solo","Just me, for now",""],["team","A helper or a team",""],["sell","I may sell or hand it over one day",""]] },
    { id:"phrases", phase:3, type:"area", key:"phrases",
      title:"What would your student type into YouTube today?",
      why:"I ask because these are the seeds for your keyword research. Their words, not yours.",
      label:"Up to 3 searches, one per line", ph:"how to get more yoga students\nyoga studio marketing ideas\nhow to fill a yoga class" },
    { id:"pain", phase:3, type:"text", key:"pain",
      title:"What frustrates them most right now?",
      why:"I ask because the best videos start from a problem the viewer already feels.",
      label:"In their own words", ph:"posting every day and still teaching to empty rooms" },
    { id:"proof", phase:3, type:"text", key:"proof",
      title:"Why should they listen to you?",
      why:"I ask because one honest line of experience makes a stranger trust your About section.",
      label:"One line of real experience or results", ph:"12 years running a studio, 300 teachers trained" },
    { id:"market", phase:3, type:"market",
      title:"Which language and country are you aiming at?",
      why:"I ask because search numbers change a lot between languages and countries.",
      },
    { id:"links", phase:4, type:"links",
      title:"Where should a viewer go after watching?",
      why:"I ask because the first link on your channel should be your free gift, so views turn into email subscribers. Leave blank what you do not have yet.",
      },
    { id:"look", phase:4, type:"look",
      title:"How should the channel feel?",
      why:"I ask because your logo and banner prompts need one clear style to look like they belong together.",
      opts:[["Clean and minimal","Clean and minimal","Lots of space, calm, simple shapes"],["Bold and energetic","Bold and energetic","Strong contrast, big type"],["Warm and personal","Warm and personal","Soft, friendly, human"],["Premium and dark","Premium and dark","Dark background, refined accents"]] },
    { id:"pace", phase:5, type:"choice", key:"pace",
      title:"How often can you really publish?",
      why:"I ask because a pace you keep beats a pace you promise. It goes into your About text and your video plan.",
      opts:[["every two weeks","Every two weeks",""],["every week","Every week",""],["twice a week","Twice a week",""]] },
    { id:"mod", phase:5, type:"choice", key:"mod",
      title:"How hands-on do you want to be with comments?",
      why:"I ask because YouTube can hold risky comments for you. This sets your moderation default.",
      opts:[["basic","Light touch","Hold only the clearly bad ones"],["strict","Careful","Hold more comments for my review"]] }
  ];
  var REQUIRED = { who:1, result:1, topic:1, phrases:1, pain:1, proof:1 };

  var SCREENS = ["g1","g2","g3"].concat(QUESTIONS.map(function(q){ return q.id; })).concat(["email","kit","paste","card"]);
  var Q_FIRST = 3, EMAIL_I = SCREENS.indexOf("email"), KIT_I = EMAIL_I + 1;

  var S = { i:0, vidiq:false, app:"", connected:false, lead:null, research:"", checks:{},
            a:{ lang:"English", country:"United States", color:"#17C05B" } };
  var IMG = { logo:null, banner:null };   /* memory only: never stored, never sent */
  var APP_VERSION = "1.2.1";
  var STORE_KEY = "bcw_state";
  var JOB = { pdf:false };   /* what is running right now */
  var LAST = {};             /* the last file made of each kind, so it can be opened again */

  /* ---------- event log: what happened, in order, so a problem can be traced ---------- */
  /* Every entry: running number, session id, time, milliseconds since the page opened, level, screen, event, detail.
     It never holds an answer, a name, an email or pasted research: only lengths, choices and technical facts. */
  var LOG = [], SEQ = 0, logT = null;
  var SESSION = Math.random().toString(36).slice(2, 8), T0 = Date.now();
  var DEBUG = /[?&]debug=1/.test(location.search);
  var IN_APP_RE = /FBAN|FBAV|FB_IAB|Instagram|LinkedInApp|MicroMessenger|TikTok/i;
  function levelOf(ev){ return /failed|error|missing/.test(ev) ? "error" : (/retry|fallback|rejected|guard|slow|validation/.test(ev) ? "warn" : "info"); }
  function errText(e){
    if(e == null) return "unknown";
    var t = (e.name && e.name !== "Error" ? e.name + ": " : "") + (e.message || String(e));
    if(e.stack && t.indexOf("| stack:") < 0){   /* a wrapped error already carries the stack of the first one */
      var st = String(e.stack).split("\n").map(function(l){ return l.trim().replace(/https?:\/\/[^\s)]*\//g, ""); }).filter(function(l){ return l && t.indexOf(l) < 0; }).slice(0, 5);
      if(st.length) t += " | stack: " + st.join(" < ");
    }
    return t;
  }
  function persistLog(now){
    clearTimeout(logT);
    function write(){
      try{ localStorage.setItem(STORE_KEY + "_log", JSON.stringify(LOG)); }
      catch(e){ try{ LOG = LOG.slice(-150); localStorage.setItem(STORE_KEY + "_log", JSON.stringify(LOG)); }catch(e2){} }
    }
    if(now) write(); else logT = setTimeout(write, 300);

  /* ---------- research: split the pasted text by heading ---------- */
  var SECTIONS = [["pillars","Pillars"],["playlists","Playlists"],["keywords","Keywords"],["competitors","Competitors"],["outliers","Outliers"],["gaps","Gaps"],["videos","Video List"]];
  function sectionKey(h){
    h = h.toLowerCase();
    if(/video\s*(list|titles?|ideas?)|first\s*20/.test(h)) return "videos";
    if(/playlist/.test(h)) return "playlists";
    if(/pillar/.test(h)) return "pillars";
    if(/competitor/.test(h)) return "competitors";
    if(/outlier/.test(h)) return "outliers";
    if(/\bgaps?\b/.test(h)) return "gaps";
    if(/seed/.test(h)) return "seeds";
    if(/keyword/.test(h)) return "keywords";
    return "";
  }
  function parseResearch(text){
    var out = { notes:[] }, cur = "notes";
    String(text || "").replace(/\r/g, "").split("\n").forEach(function(line){
      if(/^\s*```/.test(line)) return;
      var m = line.match(/^\s*#{1,4}\s+(.*)$/) || line.match(/^\s*\*\*([^*]+)\*\*:?\s*$/);
      if(m){
        var k = sectionKey(m[1]);
        if(k){ cur = k; out[cur] = out[cur] || []; return; }
        if(/^\s*#{1,2}\s/.test(line)) cur = "notes";
      }
      (out[cur] = out[cur] || []).push(line);
    });
    Object.keys(out).forEach(function(k){ out[k] = out[k].join("\n").trim(); });
    return out;
  }

  /* ---------- tiny markdown renderer: headings, tables, lists, paragraphs ---------- */
  function inline(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "$1"); }
  function cells(line){ var t = line.trim().replace(/^\|/, "").replace(/\|$/, ""); return t.split("|").map(function(c){ return c.trim(); }); }
  function mdBlocks(text, rowsPer){
    var L = String(text || "").split("\n"), out = [], i = 0;
    rowsPer = rowsPer || 1000;
    while(i < L.length){
      var ln = L[i];
      if(!ln.trim()){ i++; continue; }
      if(/^\s*\|/.test(ln)){
        var rows = [];
        while(i < L.length && /^\s*\|/.test(L[i])){
          if(!/^[\s|:\-]+$/.test(L[i])) rows.push(cells(L[i]));
          i++;
        }
        var head = rows.shift() || [];
        var th = "<tr>" + head.map(function(c){ return "<th>" + inline(c) + "</th>"; }).join("") + "</tr>";
        if(!rows.length) rows = [[]];
        for(var r = 0; r < rows.length; r += rowsPer){
          out.push("<div class='tw'><table>" + th + rows.slice(r, r + rowsPer).map(function(row){
            return "<tr>" + head.map(function(_, ci){ return "<td>" + inline(row[ci] || "") + "</td>"; }).join("") + "</tr>";
          }).join("") + "</table></div>");
        }
        continue;
      }
      var hm = ln.match(/^\s*#{1,6}\s+(.*)$/);
      if(hm){ out.push("<h4>" + inline(hm[1]) + "</h4>"); i++; continue; }
      if(/^\s*([-*]|\d+[.)])\s+/.test(ln)){
        var items = [];
        while(i < L.length && /^\s*([-*]|\d+[.)])\s+/.test(L[i])){ items.push("<li>" + inline(L[i].replace(/^\s*([-*]|\d+[.)])\s+/, "")) + "</li>"); i++; }
        for(var q = 0; q < items.length; q += 18) out.push("<ul>" + items.slice(q, q + 18).join("") + "</ul>");
        continue;
      }
      var para = [];
      while(i < L.length && L[i].trim() && !/^\s*(\||#{1,6}\s|([-*]|\d+[.)])\s)/.test(L[i])){ para.push(inline(L[i])); i++; }
      out.push("<p>" + para.join("<br>") + "</p>");
    }
    return out;
  }

  /* ---------- PDF: each block is drawn with html2canvas and placed on A4 pages by jsPDF ---------- */
  function withTimeout(p, ms, label){
    return new Promise(function(res, rej){

    });
  }
  /* The two PDF tools come from cdnjs. If one did not arrive, try again, then try a second CDN. */
  var LIBS = {
    jspdf:{ test:function(){ return !!(window.jspdf && window.jspdf.jsPDF); },
      urls:["vendor/jspdf.umd.min.js", "https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js", "https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js"] },
    h2c:{ test:function(){ return !!window.html2canvas; },
      urls:["vendor/html2canvas.min.js", "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js", "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"] }
  };
  function loadScript(url){
    return withTimeout(new Promise(function(res, rej){
      var s = document.createElement("script"); s.src = url; s.onload = res; s.onerror = function(){ rej(new Error("failed: " + url)); };

  function ensureLib(name){
    var L = LIBS[name], i = 0;
    function tryNext(){
      if(L.test()) return true;
      if(i >= L.urls.length){ log("lib-missing", name); return false; }
      var u = L.urls[i++], t0 = Date.now(); log("lib-load", u);
      return loadScript(u).then(function(){ log("lib-loaded", u + ", " + (Date.now() - t0) + " ms"); return tryNext(); }, function(e){ log("lib-load-failed", u + ", " + (Date.now() - t0) + " ms: " + errText(e)); return tryNext(); });
    }
    return Promise.resolve().then(tryNext);
  }

  /* Last resort: a plain text PDF from the markdown card. No drawing involved, so it works where html2canvas does not. */
  function latin(s){
    s = String(s); if(s.normalize) s = s.normalize("NFD").replace(/[̀-ͯ]/g, "");
    return s.replace(/[^\x20-\x7E\xA0-\xFF]/g, "?");
  }
  function textPdf(){
    var doc = new window.jspdf.jsPDF({ unit:"pt", format:"a4" });
    var W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 48, y = M;
    var lines = buildMarkdown().split("\n"), start = 0;
    if(lines[0] === "---"){ start = lines.indexOf("---", 1) + 1; }
    lines.slice(start).forEach(function(raw){
      var m = raw.match(/^(#{1,3})\s+(.*)$/), size = 9.5, style = "normal", text = raw;
      if(m){ size = m[1].length === 1 ? 18 : (m[1].length === 2 ? 14 : 11); style = "bold"; text = m[2]; y += 6; }
      doc.setFont("helvetica", style); doc.setFontSize(size);
      doc.splitTextToSize(latin(text) || " ", W - M*2).forEach(function(p){
        if(y > H - M){ doc.addPage(); y = M; }
        doc.text(p, M, y); y += size * 1.35;
      });
    });
    return doc;
  }

  function buildPdf(onStep, scale){
    var doc = new window.jspdf.jsPDF({ unit:"pt", format:"a4" });
    var W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    var M = 36, CW = W - M*2, TOP = 36, BOT = H - 46, y = TOP;
    var host = $("pdfhost"), blocks = cardBlocks(), i = 0;
    host.innerHTML = "";
    log("pdf-layout", "scale " + (scale || 2) + ", " + blocks.length + " parts");

    function place(cv, b){
      if(!cv || cv.width < 2 || cv.height < 2) return;   /* an empty block draws nothing */
      var hPt = cv.height / cv.width * CW, fmt = b.img ? "JPEG" : "PNG";
      var url = function(c){
        var u = b.img ? c.toDataURL("image/jpeg", 0.9) : c.toDataURL("image/png");
        if(!u || u.length < 64) throw new Error("canvas export failed");   /* some phones return an empty image when memory runs out */
        return u;
      };
      if(hPt <= BOT - TOP){
        /* a section heading never stays alone at the bottom of a page */
        if(y + hPt + (b.keep ? 60 : 0) > BOT){ doc.addPage(); y = TOP; }
        doc.addImage(url(cv), fmt, M, y, CW, hPt, undefined, "FAST");
        if(b.link) doc.link(M, y, CW, hPt, { url:b.link });
        y += hPt;
        return;
      }
      /* taller than a page: cut it into page-high slices */
      var off = 0;
      while(off < cv.height){
        var room = BOT - y;
        if(room < 120){ doc.addPage(); y = TOP; room = BOT - TOP; }
        var sh = Math.min(cv.height - off, Math.floor(room * cv.width / CW));
        var c = document.createElement("canvas"); c.width = cv.width; c.height = sh;
        var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, sh);
        x.drawImage(cv, 0, off, cv.width, sh, 0, 0, cv.width, sh);
        doc.addImage(url(c), fmt, M, y, CW, sh / cv.width * CW, undefined, "FAST");
        y += sh / cv.width * CW; off += sh;
      }
    }
    function next(){
      if(i >= blocks.length){
        host.innerHTML = "";
        var n = doc.internal.getNumberOfPages();
        for(var p = 1; p <= n; p++){
          doc.setPage(p); doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(85, 99, 92);
          doc.text(CARD_TITLE, M, H - 24);
          doc.text("Page " + p + " of " + n, W - M, H - 24, { align:"right" });
        }
        return doc;
      }
      var b = blocks[i++], el = document.createElement("div"), t1 = Date.now();
      var kind = b.img ? "images" : (b.link ? "program link" : (b.keep ? "heading" : "content"));
      el.className = "b"; el.innerHTML = b.h; host.appendChild(el);
      if(onStep) onStep(i, blocks.length);
      return withTimeout(window.html2canvas(el, { scale:scale || 2, backgroundColor:"#ffffff", logging:false, useCORS:true }), 25000, "pdf part " + i).then(function(cv){
        if(el.parentNode) host.removeChild(el);
        var ms = Date.now() - t1;
        if(ms > 1500) log("pdf-part-slow", "part " + i + " of " + blocks.length + " (" + kind + "), " + ms + " ms, canvas " + cv.width + " x " + cv.height);
        try{ place(cv, b); }
        catch(e){ throw new Error("placing part " + i + " of " + blocks.length + " (" + kind + ", canvas " + cv.width + " x " + cv.height + "): " + errText(e)); }
        return next();
      }, function(e){
        throw new Error("drawing part " + i + " of " + blocks.length + " (" + kind + "): " + errText(e));
      });
    }
    return Promise.resolve().then(next);
  }

  /* One PDF job at a time. It tries the designed PDF, then a lighter one, then a plain text one, and always says where it is. */
  function makePdf(){
    if(JOB.pdf) return;
    JOB.pdf = true;
    var b = $("pdfBtn"); if(b) b.disabled = true;
    var simple = false, t0 = Date.now();
    log("pdf-start", "research " + S.research.length + " chars, logo " + !!IMG.logo + ", banner " + !!IMG.banner);
    notify("Preparing your PDF. Keep this tab open, it usually takes less than a minute.", "busy");
    function step(i, n){ notify("Building your PDF, part " + i + " of " + n + ". Keep this tab open.", "busy"); }
    function clearHost(){ var h = $("pdfhost"); if(h) h.innerHTML = ""; }
    ensureLib("jspdf").then(function(ok){
      if(!ok) throw new Error("jspdf-missing");
      return ensureLib("h2c");
    }).then(function(ok){
      if(!ok){ log("pdf-fallback", "html2canvas missing"); simple = true; return textPdf(); }
      var fonts = (document.fonts && document.fonts.ready) ? withTimeout(document.fonts.ready, 3000, "fonts").catch(function(){}) : Promise.resolve();
      return fonts.then(function(){ return buildPdf(step, 2); }).catch(function(e){
        log("pdf-retry", errText(e)); clearHost();
        notify("Still working: trying a lighter version of your PDF. Keep this tab open.", "busy");
        return buildPdf(step, 1);
      }).catch(function(e){
        log("pdf-fallback", errText(e)); clearHost(); simple = true;

    }).then(function(doc){
      var blob = doc.output("blob");
      if(!blob || blob.size < 800) throw new Error("empty pdf");
      deliver("pdf", FILE_BASE + ".pdf", blob);
      log("pdf-done", doc.internal.getNumberOfPages() + " pages, " + Math.round((Date.now() - t0) / 1000) + " s" + (simple ? ", simple layout" : ""));
      var tail = storageOK ? " You can close this page now, your answers stay saved in this browser." : "";
      notify(simple
        ? "Your PDF is ready in a simple layout, because this browser could not draw the designed one. The .md file has the same content." + tail
        : "Your PDF is ready and was sent to your downloads." + tail, "ok", true);
    }).catch(function(e){
      clearHost();
      log("pdf-failed", errText(e));
      notify(e && e.message === "jspdf-missing"
        ? "The PDF tool could not load. Check your internet connection, then press Download the PDF again. The .md file works without it."
        : "The PDF could not be created on this device. Nothing is lost: download the .md file instead, it has the same content.", "err");
    }).then(function(){
      JOB.pdf = false;
      var b2 = $("pdfBtn"); if(b2) b2.disabled = false;
    });
  }

  /* Start the download and keep the file reachable, because some browsers ignore a started download without saying so. */

  /* ---------- lead capture ---------- */
  /* Never blocks the visitor and never shows an error. The outcome is kept in S.leadState and retried on the next visit. */
  function sendLead(payload){
    if(!WEBHOOK_URL){ log("lead", "no webhook set, skipped"); return; }
    S.leadState = { status:"pending", tries:(S.leadState ? S.leadState.tries : 0) + 1 }; save();
    var t0 = Date.now();
    function mark(status, note){
      if(S.leadState) S.leadState.status = status; save();
      log("lead", status + ", try " + (S.leadState ? S.leadState.tries : "?") + ", " + (Date.now() - t0) + " ms" + (note ? ", " + note : ""), status === "failed" ? "error" : (status === "sent" ? "info" : "warn"));
    }
    log("lead", "sending, try " + S.leadState.tries);
    try{
      fetch(WEBHOOK_URL, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify(payload), keepalive:true
      }).then(function(r){
        if(!r.ok) throw new Error("status " + r.status);
        mark("sent");
      }).catch(function(e){
        /* If the browser blocks the JSON request (CORS), resend as a plain form post. */
        var flat = new URLSearchParams();
        flat.append("name", payload.name);
        flat.append("email", payload.email);
        flat.append("source", payload.source);
        flat.append("ai_app", payload.ai_app);
        Object.keys(payload.answers).forEach(function(k){ flat.append(k, String(payload.answers[k])); });
        return fetch(WEBHOOK_URL, { method:"POST", mode:"no-cors", body:flat, keepalive:true }).then(function(){
          mark("sent-unconfirmed", "form post after " + errText(e));
        });
      }).catch(function(e){ mark("failed", errText(e)); });
    }catch(e){ mark("failed", errText(e)); }
  }
  function leadPayload(){ return { name:S.lead.name, email:S.lead.email, source:SOURCE, ai_app:S.app, answers:Object.assign({}, S.a) }; }
  function retryLead(){
    if(!WEBHOOK_URL || !S.lead || !S.leadState) return;
    if((S.leadState.status === "pending" || S.leadState.status === "failed") && S.leadState.tries < 5) sendLead(leadPayload());
  }

  function copyText(text, btn){
    var label = btn.getAttribute("data-label") || btn.textContent;
    btn.setAttribute("data-label", label);
    function flash(t){ btn.textContent = t; setTimeout(function(){ btn.textContent = label; }, 1600); }
    var what = btn.getAttribute("data-copy") || btn.id || "button";
    function done(how){ flash("Copied"); log("copy", what + ", " + text.length + " characters, via " + (typeof how === "string" ? how : "clipboard")); }
    function manual(why){
      /* Copying is blocked here: select the text so the visitor can copy it by hand. */
      log("copy-failed", what + ", " + text.length + " characters: " + why);
      flash("Copy by hand");
      var card = btn.closest ? btn.closest(".card") : null, pre = card ? card.querySelector("pre.out") : null;

  function readImage(file, kind, cb){
    if(!file) return;
    if(!/^image\//.test(file.type)){ log("image-rejected", kind + ", type " + (file.type || "unknown")); notify("That file is not an image. Choose a PNG or JPG.", "err"); return; }
    if(file.size > 30 * 1048576){ log("image-rejected", kind + ", " + Math.round(file.size / 1048576) + " MB"); notify("That image is over 30 MB. Export a smaller PNG or JPG and try again.", "err"); return; }
    var t0 = Date.now();
    log("image-read", kind + ", " + file.type + ", " + Math.round(file.size / 1024) + " KB");
    notify("Reading your image.", "busy");
    var fr = new FileReader();
    fr.onerror = function(){ log("image-failed", kind + ", could not read the file"); notify("The image could not be read. Try again, or export it as PNG or JPG.", "err"); };
    fr.onload = function(){
      var im = new Image();
      im.onerror = function(){ log("image-failed", kind + ", cannot decode " + file.type); notify("This browser cannot open that image format. Export it as PNG or JPG and try again.", "err"); };
      im.onload = function(){
        var w = im.naturalWidth, h = im.naturalHeight, max = kind === "banner" ? 2560 : 1200, src = fr.result;
        /* a huge photo can exhaust a phone's memory later, in the PDF step: keep a sensible copy */
        try{
          if(Math.max(w, h) > max){
            var k = max / Math.max(w, h), c = document.createElement("canvas");
            c.width = Math.round(w * k); c.height = Math.round(h * k);
            c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
            var u = c.toDataURL(kind === "banner" ? "image/jpeg" : "image/png", 0.92);
            if(u && u.length > 100) src = u;
          }
        }catch(e){ log("image-downscale-failed", errText(e)); }
        IMG[kind] = src; IMG[kind + "Size"] = w + " x " + h;
        log("image-ok", kind + ", " + w + " x " + h + ", " + file.type + ", " + Math.round(file.size / 1024) + " KB" + (src !== fr.result ? ", scaled down to fit " + max + " px" : "") + ", " + (Date.now() - t0) + " ms");
        notify("Image added. It stays on this device and is not kept after a reload.", "ok");
        cb();
      };
      im.src = fr.result;
    };
    try{ fr.readAsDataURL(file); }catch(e){ fr.onerror(); }
  }

    if(!l || !b) return;   /* the visitor moved to another screen while the image was loading */
    l.innerHTML = IMG.logo ? "<div class='logos'>" + [[120,"Channel page"],[48,"Under videos"],[24,"Comments"]].map(function(s){
      return "<figure><img src='" + IMG.logo + "' width='" + s[0] + "' height='" + s[0] + "' alt='Logo preview'>" + s[1] + "</figure>"; }).join("") + "</div>" +
      "<p class='hint'>Your file is " + IMG.logoSize + (IMG.logoSize === "800 x 800" ? ". Right size." : ". YouTube wants 800 x 800, square.") + " Can you still read it in the smallest circle?</p>" : "";
    b.innerHTML = IMG.banner ? "<div class='banner'><img src='" + IMG.banner + "' alt='Banner preview'><div class='desk' id='deskO'></div><div class='safe' id='safeO'><span>Safe area 1546 x 423</span></div></div>" +
      "<label class='chk'><input type='checkbox' id='ovl' checked><span>Show the safe area<span class='p'>Green box: what phones show. Dashed strip: what desktop shows. Everything darkened only appears on TVs.</span></span></label>" +
      "<p class='hint'>Your file is " + IMG.bannerSize + (IMG.bannerSize === "2560 x 1440" ? ". Right size." : ". YouTube wants 2560 x 1440.") + " All text and the logo must sit inside the green box.</p>" : "";
    var o = $("ovl"); if(o) o.addEventListener("change", function(){ $("safeO").hidden = !this.checked; $("deskO").hidden = !this.checked; });
  }
  function paste(){
    stage.innerHTML = tabs() +
      "<div class='card'><h3>Paste your research from " + appName() + "</h3><p class='hint'>Copy the whole answer from " + appName() + " and paste it here, tables and all. It stays in this browser" + (storageOK ? ", saved as you type, so you can close this tab and finish later on this device" : "") + ".</p>" +
      "<textarea class='tall' id='research' placeholder='## Seeds&#10;| # | Seed | Why this seed |&#10;...'>" + esc(S.research) + "</textarea>" +
      "<div class='found' id='found'>" + foundHtml() + "</div>" +
      "<p class='hint'>A section shows as missing when its heading is not in the text. You can still download the card and add it later.</p></div>" +
      "<div class='card'><h3>Add your logo and banner (optional)</h3><p class='hint'>Made them with the image prompts? Check them here before you upload to YouTube. The files are read by your browser only. They are never stored and never sent anywhere.</p>" +
      "<div class='drop'><label class='flabel' for='logoFile'>Logo or profile picture</label><input type='file' id='logoFile' accept='image/*'><div id='logoPrev'></div></div>" +
      "<div class='drop'><label class='flabel' for='bannerFile'>Banner</label><input type='file' id='bannerFile' accept='image/*'><div id='bannerPrev'></div></div></div>" +
      "<div class='nav'><button type='button' class='btn ghost' id='back'>Back to the kit</button><button type='button' class='btn' id='next'>Next: build my card</button></div>";
    bindTabs(); previews();
    $("research").addEventListener("input", function(){ S.research = this.value; saveSoon(); $("found").innerHTML = foundHtml(); clearTimeout(resT); resT = setTimeout(logResearch, 1500); });
    $("logoFile").addEventListener("change", function(){ readImage(this.files[0], "logo", previews); });
    $("bannerFile").addEventListener("change", function(){ readImage(this.files[0], "banner", previews); });
    bindNav();
  }

  function card(){
    var has = !!S.research.trim(), R0 = parseResearch(S.research);
    var nFound = SECTIONS.filter(function(s){ return R0[s[0]]; }).length;
    var inApp = IN_APP_RE.test(navigator.userAgent);
    stage.innerHTML = tabs() +
      "<div class='card hl'><h3 id='qh' tabindex='-1'>Your " + CARD_TITLE + "</h3>" +
      "<p class='hint'>" + (has ? "Your texts, your research and your checklist in one place." : "You have not pasted any research yet, so those sections will be empty. You can still download the card now and come back later.") + "</p>" +
      "<div class='nav'><button type='button' class='btn' id='pdfBtn'" + (JOB.pdf ? " disabled" : "") + ">Download the PDF</button><button type='button' class='btn ghost' id='mdBtn'>Download the .md file</button></div>" +
      "<p class='hint'>In this card: research " + nFound + " of " + SECTIONS.length + " sections, logo " + (IMG.logo ? "yes" : "no") + ", banner " + (IMG.banner ? "yes" : "no") + "." + (!IMG.logo && !IMG.banner ? " Images are not kept after a reload, so add them on Paste back right before you download." : "") + "</p>" +
      (inApp ? "<p class='hint'>You seem to be inside another app's built-in browser, where downloads often do nothing. If nothing arrives, open this page in Safari or Chrome.</p>" : "") +
      "<div id='files'>" + filesHtml() + "</div>" +
      "<p class='hint'>The .md file has fixed headings, so other tools can read it later. <button type='button' class='linkbtn' id='mdCopy'>Copy the .md text instead</button></p></div>" +
      "<div class='card'><p class='cta'>" + esc(CTA_LINE) + " <a id='programLink' href='" + esc(PROGRAM_URL) + "' target='_blank' rel='noopener'>See the program</a></p></div>" +
      "<div class='card'><h3>Preview</h3><div class='md' id='preview'></div></div>" +
      "<div class='nav'><button type='button' class='btn ghost' id='back'>Back</button><button type='button' class='btn ghost' id='restart'>Start over</button></div>";
    bindTabs(); bindNav();
    var R = parseResearch(S.research), prev = "<h4>Channel</h4><p><b>" + esc(nameOptions()[0]) + "</b> " + esc(handleOptions()[0] || "") + "<br>" + esc(taglines()[0]) + "</p>";
    SECTIONS.forEach(function(s){ prev += "<h4>" + s[1] + "</h4>" + (R[s[0]] ? mdBlocks(R[s[0]]).join("") : "<p class='hint'>Not pasted yet.</p>"); });
    $("preview").innerHTML = prev;
    $("mdBtn").addEventListener("click", function(){
      try{
        deliver("md", FILE_BASE + ".md", new Blob([buildMarkdown()], { type:"text/markdown;charset=utf-8" }));
        if(!JOB.pdf) notify("Your .md file is ready and was sent to your downloads.", "ok");
      }catch(e){
        log("md-failed", errText(e));
        notify("The .md file could not be created. Use Copy the .md text instead, then paste it into a note.", "err");
      }
    });
    $("mdCopy").addEventListener("click", function(){
      try{ copyText(buildMarkdown(), this); log("md-copied", ""); }
      catch(e){ softError("md-copy-failed", errText(e)); }
    });
    $("pdfBtn").addEventListener("click", makePdf);
    /* two presses instead of a browser dialog, which some in-app browsers never show */
    var armed = null;
    $("restart").addEventListener("click", function(){
      var btn = this;
      if(!armed){
        btn.textContent = "Press again to clear all answers";
        armed = setTimeout(function(){ armed = null; btn.textContent = "Start over"; }, 5000);
        return;
      }
      clearTimeout(armed);
      log("restart", "all answers cleared by the visitor"); persistLog(true);
      try{ localStorage.removeItem(STORE_KEY); }catch(e){}
      location.reload();
    });
  }

  /* ---------- safety net: nothing fails silently, and nothing shows a raw error ---------- */
  window.addEventListener("error", function(e){
    if(e && e.target && e.target !== window && e.target.tagName){ log("resource-failed", e.target.tagName.toLowerCase() + " " + (e.target.src || e.target.href || "") + (navigator.onLine ? "" : " (offline)")); return; }
    softError("error", (e && e.error ? errText(e.error) : (e && e.message || "unknown")) + " at " + String(e && e.filename || "").split("/").pop() + ":" + (e && e.lineno) + ":" + (e && e.colno));
  }, true);
  window.addEventListener("unhandledrejection", function(e){
    softError("promise-error", errText(e && e.reason));
  });
  window.addEventListener("online", function(){ log("network", "online"); });
  window.addEventListener("offline", function(){ log("network", "offline"); });
  window.addEventListener("pagehide", function(){ log("page", "closed or left" + (JOB.pdf ? " while the PDF was being built" : "")); save(); persistLog(true); });
  document.addEventListener("visibilitychange", function(){ log("page", document.hidden ? "tab hidden" + (JOB.pdf ? " while the PDF was being built" : "") : "tab visible again"); if(document.hidden){ save(); persistLog(true); } });
  document.addEventListener("click", function(e){
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
    if(a) log("link", (a.id ? a.id + ": " : "") + (a.href.indexOf("blob:") === 0 ? "file opened in a new tab" : a.href));
  }, true);
  window.addEventListener("beforeunload", function(e){ if(JOB.pdf){ e.preventDefault(); e.returnValue = ""; } });
  window.addEventListener("popstate", function(e){
    if(e.state && typeof e.state.i === "number") go(e.state.i, true);
  });
  $("diagBtn").addEventListener("click", function(){ copyText(report(), this); });
  $("logBtn").addEventListener("click", function(){
    try{ deliver("log", "brand-channel-wizard-log.txt", new Blob([report()], { type:"text/plain;charset=utf-8" })); notify("The log file was sent to your downloads.", "ok"); }
    catch(e){ log("log-download-failed", errText(e)); copyText(report(), this); }
  });
  window.BCW = { version:APP_VERSION, report:report, log:function(){ return LOG.slice(); } };   /* for the browser console */
  $("ver").textContent = "v" + APP_VERSION;

  load();
  log("open", "v" + APP_VERSION + ", screen " + SCREENS[S.i] + ", saved state " + (function(){ try{ return (localStorage.getItem(STORE_KEY) || "").length; }catch(e){ return "?"; } })() + " characters" + (storageOK ? "" : ", storage not available") + (DEBUG ? ", debug view on" : ""));
  log("env", navigator.userAgent + " | " + envText());
  if(DEBUG){ $("logview").hidden = false; paintLog(); }
  render();
  try{ history.replaceState({ i:S.i }, ""); }catch(e){}   /* after render, so the guards have already picked the real screen */
  if(!storageOK) notify("This browser is not saving your progress (private mode, or its storage is blocked). You can keep going, but keep this tab open until you have downloaded your card.", "err");
  retryLead();
})();
</script>
</body>
</html>
